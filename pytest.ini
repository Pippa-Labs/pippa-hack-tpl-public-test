[pytest]
# Your tests live beside your app, at the top level.
testpaths = .
python_files = test_*.py

# Quiet by default (`pytest -v` when you want each test name), and the
# network-marked tests are left out.
#
# One `addopts` line only: a second one REPLACES the first rather than adding
# to it, so splitting these across two lines silently drops whichever came
# earlier.
addopts = -q -m "not network"

# `conftest.py` refuses every outbound socket during the suite, because a test
# that really calls the API passes here and then fails on a train. A test that
# deliberately checks the live API is marked `network`, and the build leaves it
# out.
markers =
    network: calls the real API; deselected by default
